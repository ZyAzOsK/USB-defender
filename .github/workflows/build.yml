name: 'Build & Release USB Defender'

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ──────────────────────────────────────────────
  # Test suite — gates every build below.
  # Runs on all three platforms because most of what broke in v1.0.2 was
  # platform-specific and never executed on the developer's Linux box.
  # ──────────────────────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest app/tests -v

      - name: Check version consistency
        run: python scripts/bump_version.py --check

      - name: Portable scanner responds
        run: python portable/usb_defender_portable.py --help

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: cd dashboard && npm ci

      - name: Typecheck and build
        run: cd dashboard && npm run build

  # ──────────────────────────────────────────────
  # Build the Portable Scanner binaries
  # Heavy jobs are skipped for pull requests — tests give fast feedback there,
  # while pushes to main and tags get the full matrix.
  # ──────────────────────────────────────────────
  build-portable:
    needs: [test]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: usb-defender-linux
          - os: windows-latest
            name: USBDefender.exe
          - os: macos-latest
            name: usb-defender-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build portable scanner
        run: |
          pyinstaller --onefile --clean --noconfirm \
            --name "${{ matrix.name }}" \
            --distpath portable/dist \
            portable/usb_defender_portable.py
        shell: bash

      - name: Smoke-test the frozen binary
        run: |
          "portable/dist/${{ matrix.name }}" --help > /dev/null
          echo "OK: frozen portable scanner runs"
        shell: bash

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: portable/dist/${{ matrix.name }}*
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Build the Desktop App (Tauri + Python sidecar)
  # ──────────────────────────────────────────────
  build-desktop:
    needs: [test, frontend]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-triple: x86_64-unknown-linux-gnu
            exe-suffix: ''
          - os: windows-latest
            target-triple: x86_64-pc-windows-msvc
            exe-suffix: '.exe'
          - os: macos-latest
            target-triple: aarch64-apple-darwin
            exe-suffix: ''
          - os: macos-13
            target-triple: x86_64-apple-darwin
            exe-suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Python API sidecar
        # PyInstaller's --add-data separator is os.pathsep, so it differs on
        # Windows. The websockets collection is what makes /ws/monitor work at
        # all in a frozen build.
        run: |
          mkdir -p dashboard/src-tauri/sidecars
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller --onefile --clean --noconfirm \
            --name "usb-defender-api" \
            --distpath dashboard/src-tauri/sidecars \
            --add-data "app/signatures.json${SEP}." \
            --add-data "portable/scan.sh${SEP}." \
            --add-data "portable/scan.bat${SEP}." \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --collect-submodules websockets \
            app/api.py
        shell: bash

      - name: Verify sidecar health, WebSockets and persistent state
        # Fails the build if /ws/monitor cannot upgrade (the v1.0.2 Live
        # Monitor bug) or if writable state resolves inside _MEIPASS.
        run: |
          python scripts/verify_sidecar.py \
            "dashboard/src-tauri/sidecars/usb-defender-api${{ matrix.exe-suffix }}"
        shell: bash

      - name: Build portable scanner for the Arm USB feature
        # Bundled under one canonical name so tauri.conf.json externalBin can
        # reference it on every platform. In v1.0.2 this binary was built but
        # never declared in externalBin, so it was never bundled and Arm USB
        # always returned HTTP 500.
        run: |
          pyinstaller --onefile --clean --noconfirm \
            --name "usb-defender-portable" \
            --distpath dashboard/src-tauri/sidecars \
            portable/usb_defender_portable.py
        shell: bash

      - name: Attach target triples to sidecars
        run: |
          cd dashboard/src-tauri/sidecars
          SUFFIX="${{ matrix.exe-suffix }}"
          TRIPLE="${{ matrix.target-triple }}"
          for base in usb-defender-api usb-defender-portable; do
            if [ -f "${base}${SUFFIX}" ]; then
              cp "${base}${SUFFIX}" "${base}-${TRIPLE}${SUFFIX}"
              echo "prepared ${base}-${TRIPLE}${SUFFIX}"
            else
              echo "ERROR: expected ${base}${SUFFIX} to exist"
              ls -la
              exit 1
            fi
          done
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        run: cd dashboard && npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target-triple }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: dashboard
          args: --target ${{ matrix.target-triple }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target-triple }}
          path: |
            dashboard/src-tauri/target/${{ matrix.target-triple }}/release/bundle/**/*.deb
            dashboard/src-tauri/target/${{ matrix.target-triple }}/release/bundle/**/*.rpm
            dashboard/src-tauri/target/${{ matrix.target-triple }}/release/bundle/**/*.AppImage
            dashboard/src-tauri/target/${{ matrix.target-triple }}/release/bundle/**/*.msi
            dashboard/src-tauri/target/${{ matrix.target-triple }}/release/bundle/**/*.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Create a GitHub Release with all artifacts
  # ──────────────────────────────────────────────
  release:
    needs: [build-portable, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the declared app version
        # v1.0.2 published installers named 1.0.0 because the tag and
        # tauri.conf.json had drifted. Refuse to publish that again.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('dashboard/src-tauri/tauri.conf.json').read_text())['version'])")
          echo "tag=$TAG  tauri.conf.json=$CONF"
          if [ "$TAG" != "$CONF" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match version $CONF"
            echo "Fix with: python scripts/bump_version.py $TAG"
            exit 1
          fi
          python scripts/bump_version.py --check

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
